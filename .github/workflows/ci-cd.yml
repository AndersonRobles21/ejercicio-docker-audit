name: CI/CD

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: pytest
        run: python -m pytest

      - name: Bandit
        run: |
          pip install bandit
          bandit -r . --exclude ./.venv,./.git,./__pycache__,./.pytest_cache --severity-level medium

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t ejercicio-docker-audit:${{ github.sha }} .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'image'
          image-ref: ejercicio-docker-audit:${{ github.sha }}
          severity: 'HIGH,CRITICAL'
          exit-code: '1'

      - name: Deploy to EC2
        if: success()
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || 22 }}
          script: |
            set -e
            cd ${{ secrets.EC2_PROJECT_PATH || '/opt/ejercicio-docker-audit' }}
            git pull origin ${{ github.ref_name }}
            docker compose up -d --build
